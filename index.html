<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مغامرة الجملة الاسمية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Arial",sans-serif;background:#dff5ff;color:#17324d;overflow-x:hidden}
.page{display:none;min-height:100vh;padding:28px 18px 90px;position:relative;overflow:hidden}
.page.active{display:flex;flex-direction:column;align-items:center}
.sky{position:absolute;inset:0;background:linear-gradient(#9ee5ff 0 55%,#a9df7a 55%);z-index:-3}
.sun{position:absolute;width:100px;height:100px;border-radius:50%;background:#ffd84d;top:35px;left:30px;box-shadow:0 0 30px #ffe889}
.cloud{position:absolute;background:white;border-radius:50px;width:150px;height:45px;opacity:.9;top:85px;right:30px}.cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%;width:60px;height:60px;top:-25px}.cloud:before{right:25px}.cloud:after{right:75px}
.hill{position:absolute;bottom:-55px;width:120%;height:170px;background:#74bd67;border-radius:50% 50% 0 0;z-index:-2}
.card{width:min(900px,96vw);background:rgba(255,255,255,.94);border-radius:28px;padding:25px;box-shadow:0 10px 30px #0002;text-align:center}
h1{font-size:clamp(34px,7vw,64px);margin:12px 0;color:#235c91}.sub{font-size:22px}.detective{font-size:85px;margin:10px}
h2{font-size:32px;color:#235c91}.goal{background:#fff4b8;margin:10px;padding:14px;border-radius:18px;font-size:20px}
.example{font-size:27px;background:#eaf7ff;border-radius:20px;padding:16px;margin:12px}.blue{color:#1774b8;font-weight:800}.orange{color:#e47b24;font-weight:800}
.btn{border:0;border-radius:18px;padding:14px 22px;margin:7px;font-size:19px;font-weight:700;background:#2d86d7;color:white;box-shadow:0 5px 0 #1c5e9b;cursor:pointer}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1c5e9b}.btn.alt{background:#ff9d3f;box-shadow:0 5px 0 #cc6e1e}.btn.good{background:#55b96b;box-shadow:0 5px 0 #378249}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px auto;max-width:650px}.option{background:white;border:3px solid #c9e8f8;border-radius:18px;padding:16px;font-size:22px;cursor:pointer}.option:hover{background:#effaff}.correct{background:#c9f5cf!important;border-color:#45ad58!important}.wrong{background:#ffd0d0!important;border-color:#df5757!important}
.feedback{font-size:22px;font-weight:700;min-height:32px}.score{font-size:20px;background:#fff4b8;padding:9px 18px;border-radius:20px;display:inline-block}
.timer{font-size:42px;font-weight:900;color:#d9534f;margin:8px}.progress{width:min(700px,90%);height:12px;background:#ddd;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#55b96b;transition:.3s}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:700px;width:100%;margin:18px auto}.match button{font-size:20px;padding:16px;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 12px #0001;cursor:pointer}.selected{outline:4px solid #ffb347}.done{background:#c9f5cf!important}
.nav{position:fixed;bottom:12px;left:0;right:0;text-align:center;z-index:5}
.small{font-size:17px;color:#496579}.badge{display:inline-block;background:#e9dcff;padding:8px 15px;border-radius:18px;margin:5px}
@media(max-width:600px){.options{grid-template-columns:1fr}.match{grid-template-columns:1fr}.card{padding:18px}.btn{font-size:17px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const pages=[];
let score=0, qIndex=0, time=15, timerId=null, selected=null;
function addPage(content){pages.push(content)}
addPage(`<div class="sky"></div><div class="sun"></div><div class="cloud"></div><div class="hill"></div>
<div class="card" style="margin-top:8vh"><div class="detective">🕵️‍♀️📚</div><h1>مغامرة الجملة الاسمية</h1><p class="sub">هل أنتِ مستعدة لتصبحي محققة نحوية؟ 🔎</p>
<p class="sub">اكتشفي المبتدأ والخبر واجمعي أكبر عدد من النقاط!</p><button class="btn good" onclick="go(1)">ابدئي المغامرة 🚀</button></div>`);
addPage(`<div class="sky"></div><div class="sun"></div><div class="hill"></div><div class="card"><h2>🎯 أهداف المغامرة</h2>
<div class="goal">أتعرف الجملة الاسمية.</div><div class="goal">أميز المبتدأ والخبر.</div><div class="goal">أكوّن جملة اسمية صحيحة.</div><div class="goal">أشارك في الأنشطة وأجيب بثقة.</div>
<button class="btn" onclick="go(2)">التالي ➜</button></div>`);
addPage(`<div class="sky"></div><div class="cloud"></div><div class="hill"></div><div class="card"><h2>📚 لنكتشف معًا</h2>
<p class="sub">الجملة الاسمية تبدأ باسم، وتتكون من جزأين أساسيين:</p>
<div class="example"><span class="blue">الطالبُ</span> <span class="orange">مجتهدٌ</span></div>
<p class="sub"><span class="blue">الطالبُ = مبتدأ</span> ⭐ &nbsp; <span class="orange">مجتهدٌ = خبر</span> ⭐</p>
<div class="example"><span class="blue">الحديقةُ</span> <span class="orange">جميلةٌ</span></div>
<p class="small">اسألي نفسك: عن مَن أو ماذا نتحدث؟ ← المبتدأ. ماذا نقول عنه؟ ← الخبر.</p>
<button class="btn" onclick="go(3)">إلى الألعاب 🎮</button></div>`);
addPage(`<div class="sky"></div><div class="hill"></div><div class="card"><h2>🧩 لعبة التوصيل</h2><p class="sub">اختاري المبتدأ ثم الخبر المناسب لتكوين جملة اسمية.</p>
<div class="match" id="match"></div><div class="feedback" id="mfeed"></div><button class="btn" onclick="resetMatch()">لعبة جديدة 🔄</button>
<button class="btn" onclick="go(4)">الأسئلة ⏱️</button></div>`);
addPage(`<div class="sky"></div><div class="sun"></div><div class="hill"></div><div class="card"><div class="score">النقاط: <span id="score">0</span> ⭐</div>
<h2 id="qtitle">⏱️ السؤال 1</h2><div class="timer" id="timer">15</div><div class="progress"><div class="bar" id="bar"></div></div>
<p id="question" class="sub"></p><div class="options" id="options"></div><div class="feedback" id="feedback"></div>
<button class="btn" id="next" style="display:none" onclick="nextQ()">السؤال التالي ➜</button></div>`);
addPage(`<div class="sky"></div><div class="sun"></div><div class="hill"></div><div class="card"><div class="detective">🏆🕵️‍♀️</div>
<h1>انتهت المغامرة!</h1><p class="sub">أحسنتِ يا محققة النحو 🌟</p><div class="score" style="font-size:28px">نتيجتك: <span id="final">0</span> ⭐</div>
<p class="sub" id="message"></p><button class="btn good" onclick="location.reload()">إعادة المغامرة 🔄</button></div>`);
function render(){app.innerHTML=pages.map((x,i)=>`<section class="page ${i===0?'active':''}" id="p${i}">${x}</section>`).join('')}
function go(n){document.querySelectorAll('.page').forEach((p,i)=>p.classList.toggle('active',i===n)); if(n===3)resetMatch(); if(n===4)startQuiz(); if(n===5)finish()}
const pairs=[["الطالبُ","مجتهدٌ"],["الزهرةُ","جميلةٌ"],["السماءُ","صافيةٌ"],["البيتُ","واسعٌ"]];
function resetMatch(){selected=null;document.getElementById('mfeed').textContent='';let a=pairs.map(x=>x[0]),b=pairs.map(x=>x[1]).sort(()=>Math.random()-.5);
match.innerHTML='<div>'+a.map((x,i)=>`<button data-side="a" data-i="${i}" onclick="pick(this)">${x}</button>`).join('')+'</div><div>'+b.map(x=>`<button data-side="b" data-val="${x}" onclick="pick(this)">${x}</button>`).join('')+'</div>'}
function pick(el){if(el.classList.contains('done'))return;if(!selected){selected=el;el.classList.add('selected');return}
let a=selected.dataset.side==='a'?selected:el,b=selected.dataset.side==='b'?selected:el;
if(a.dataset.side==='a'&&b.dataset.side==='b'){let i=+a.dataset.i;if(b.dataset.val===pairs[i][1]){a.classList.add('done');b.classList.add('done');score++;document.getElementById('mfeed').textContent='ممتاز! جملة صحيحة 🎉';sound(true)}else{document.getElementById('mfeed').textContent='حاولي مرة أخرى 💡';sound(false)}}
selected.classList.remove('selected');selected=null;document.querySelector('#score')?.textContent=score}
const qs=[
["أي جملة اسمية صحيحة؟",["الطالبُ مجتهدٌ","كتبَ الطالبُ","يقرأُ أحمدُ","ذهبَ خالدٌ"],0],
["ما المبتدأ في: «الحديقةُ جميلةٌ»؟",["جميلةٌ","الحديقةُ","في","لا يوجد"],1],
["ما الخبر في: «السماءُ صافيةٌ»؟",["السماءُ","صافيةٌ","ال","هي"],1],
["أكملي: «المعلمُ ____»",["نشيطٌ","يكتبُ","ذهبَ","يلعبُ"],0]
];
function startQuiz(){qIndex=0;score=score||0;showQ()}
function showQ(){clearInterval(timerId);let q=qs[qIndex];document.getElementById('qtitle').textContent=`⏱️ السؤال ${qIndex+1} من ${qs.length}`;document.getElementById('question').textContent=q[0];document.getElementById('options').innerHTML=q[1].map((x,i)=>`<button class="option" onclick="answer(${i},this)">${x}</button>`).join('');document.getElementById('feedback').textContent='';document.getElementById('next').style.display='none';time=15;timer.textContent=time;bar.style.width='0%';timerId=setInterval(()=>{time--;timer.textContent=time;bar.style.width=((15-time)/15*100)+'%';if(time<=0){clearInterval(timerId);document.getElementById('feedback').textContent='⏰ انتهى الوقت!';sound(false);disableOptions();document.getElementById('next').style.display='inline-block'}},1000)}
function answer(i,el){clearInterval(timerId);let correct=qs[qIndex][2];disableOptions();if(i===correct){el.classList.add('correct');score+=2;feedback.textContent='🎉 إجابة صحيحة! أحسنتِ';sound(true)}else{el.classList.add('wrong');document.querySelectorAll('.option')[correct].classList.add('correct');feedback.textContent='💡 ليست صحيحة، شاهدي الإجابة الصحيحة.';sound(false)}document.getElementById('score').textContent=score;document.getElementById('next').style.display='inline-block'}
function disableOptions(){document.querySelectorAll('.option').forEach(x=>x.disabled=true)}
function nextQ(){qIndex++;if(qIndex<qs.length)showQ();else go(5)}
function finish(){document.getElementById('final').textContent=score;document.getElementById('message').textContent=score>=8?'🌟 رائع جدًا! أنتِ محققة نحوية محترفة!':score>=4?'👏 ممتاز! واصلي التدريب.':'💪 بداية جميلة، جربي مرة أخرى!'}
function sound(ok){try{let c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?880:220;o.type='sine';g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.03);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.35);o.start();o.stop(c.currentTime+.4)}catch(e){}}
render();
</script>
</body></html>
